services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LISTEN_HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /data/numbers.db
    volumes:
      - scores:/data
    networks:
      - internal
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
networks:
  internal:
volumes:
  scores:
  caddy_data:
  caddy_config:
